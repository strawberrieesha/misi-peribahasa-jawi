<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Jawi: Cabaran Kod Rahsia</title><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#26355b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 5%,#fff7ac,transparent 38%),linear-gradient(140deg,#a7eaff,#fce4ff 55%,#b7f5db);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:14px}.hero{text-align:center}.hero h1{color:#7040ad;font-size:clamp(25px,5vw,45px);margin:9px 0}.panel{background:#fffffff2;border:5px solid #fff;border-radius:28px;padding:clamp(14px,3vw,28px);box-shadow:0 15px 40px #6348a026;margin:16px 0}.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px}.between{justify-content:space-between}.btn{border:0;border-bottom:4px solid #5134a3;background:#7e61da;color:#fff;border-radius:15px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer;touch-action:manipulation}.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed}.pink{background:#ee669b;border-color:#bd3870}.green{background:#16ae86;border-color:#0c775d}.gold{background:#edae32;border-color:#b77c12}.choice{background:#f1ecff;border:2px solid #cfc0f9;color:#332e66;max-width:100%;min-width:130px}.choice.sel{background:#ffe7a5;border-color:#f5b839}.pill{background:#fff0b6;border-radius:25px;padding:8px 12px;font-weight:bold}.jawi{font-family:'Noto Naskh Arabic','Traditional Arabic','Scheherazade New',serif;direction:rtl;font-size:clamp(27px,4vw,39px);line-height:2.1;text-align:center}.jawi.small{font-size:clamp(21px,2.8vw,29px)}.question{font-size:20px;font-weight:bold;text-align:center}.progress{height:13px;border-radius:20px;background:#eae3ff;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#29b9a7,#9e74e5);transition:width .3s}.notice{min-height:30px;text-align:center;font-weight:bold;padding:6px}.ok{color:#087c59}.err{color:#c63560}.slots{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:75px}.slot{background:#fff3cb;border:2px dashed #cba74c;border-radius:12px;min-width:75px;min-height:65px;padding:8px}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match .btn{width:100%;margin-bottom:7px;min-width:0}.match .done{opacity:.42}.input{padding:13px;font-size:19px;border:3px solid #b6a0ed;border-radius:13px;width:min(100%,520px)}.timer{font-size:19px;font-weight:900;background:#e8fff1;padding:8px 13px;border-radius:20px}.timer.danger{background:#ffe1e8;color:#be2753}.wheel-area{display:grid;place-items:center;margin:12px 0}.wheel-frame{width:min(74vw,340px);height:min(74vw,340px);position:relative}.wheel{position:absolute;inset:8px;border-radius:50%;border:9px solid #fff;box-shadow:0 0 0 5px #e4a947,0 12px 30px #563d7138;background:conic-gradient(#ff8ba9 0 72deg,#ffe279 72deg 144deg,#8ee6cc 144deg 216deg,#a7a9ff 216deg 288deg,#ffba8a 288deg 360deg);transform:rotate(0deg);transition:transform 4.2s cubic-bezier(.12,.76,.11,1);display:grid;place-items:center}.wheel:before{content:'✦  ✿  ★  ✦  ✿';position:absolute;inset:30px;display:grid;place-items:center;text-align:center;color:#ffffffb9;font-size:31px;letter-spacing:10px}.wheel-center{position:relative;z-index:2;background:#fff;border:5px solid #f6c650;border-radius:50%;width:95px;height:95px;display:grid;place-items:center;font-size:42px;box-shadow:0 3px 8px #0002}.pointer{position:absolute;z-index:4;top:-13px;left:50%;transform:translateX(-50%);color:#dc3676;font-size:42px;filter:drop-shadow(0 2px 1px white)}.wheel.spinning{filter:saturate(1.2)}.muted{color:#63708a;font-size:14px}.foot{text-align:center;font-size:12px;color:#5c6685;padding:6px}.secret{font-size:75px;color:#e66b94;font-weight:900}.hidden{display:none!important}@media(max-width:540px){.match{gap:5px}.match .btn{padding:8px 5px;font-size:13px}.match .jawi{font-size:21px}.btn{font-size:14px;padding:11px}.panel{padding:12px}}
</style></head><body><div class="wrap"><header class="hero"><div style="font-size:42px">🌈 🏝️ 🎡 🗝️ 💎</div><h1>MISI JAWI: KOD RAHSIA!</h1><div>4 Misi • 5 Cabaran setiap misi • 2 minit 30 saat setiap misi</div></header><main id="app" class="panel"></main><footer class="foot">🎓 Versi latihan: guru disarankan menyemak ejaan Jawi dengan rujukan sekolah sebelum digunakan.</footer></div><script>
const BANK=[[{"r": "Bagai aur dengan tebing", "j": "باڬاي اور دڠن تبيڠ", "m": "Saling membantu antara satu sama lain"}, {"r": "Sediakan payung sebelum hujan", "j": "سدياکن ڤايوڠ سبلوم هوجن", "m": "Bersedia sebelum ditimpa kesusahan"}, {"r": "Bagai isi dengan kuku", "j": "باڬاي ايسي دڠن کوکو", "m": "Hubungan yang sangat rapat"}, {"r": "Sedikit-sedikit lama-lama menjadi bukit", "j": "سديکيت٢ لام٢ منجادي بوکيت", "m": "Usaha kecil yang berterusan membawa hasil"}, {"r": "Bagai pinang dibelah dua", "j": "باڬاي ڤينڠ دبله دوا", "m": "Pasangan yang sangat sepadan"}], [{"r": "Seperti katak di bawah tempurung", "j": "سڤرتي کاتق دباوه تمڤوروڠ", "m": "Orang yang kurang pengetahuan tentang dunia luar"}, {"r": "Air dicincang tidak akan putus", "j": "اءير دچينچڠ تيدق اکن ڤوتوس", "m": "Hubungan keluarga tidak mudah terputus"}, {"r": "Berat sama dipikul ringan sama dijinjing", "j": "برت سام دڤيکول ريڠن سام دجينجيڠ", "m": "Bekerjasama ketika susah dan senang"}, {"r": "Bagai mencurah air ke daun keladi", "j": "باڬاي منچوره اءير ک داون کلادي", "m": "Nasihat yang tidak diendahkan"}, {"r": "Harapkan pagar, pagar makan padi", "j": "هارڤکن ڤاڬر، ڤاڬر ماکن ڤادي", "m": "Orang dipercayai yang mengkhianati amanah"}], [{"r": "Bagai telur di hujung tanduk", "j": "باڬاي تلور دهوجوڠ تندوق", "m": "Keadaan yang sangat berbahaya"}, {"r": "Bulat air kerana pembetung, bulat manusia kerana muafakat", "j": "بولت اءير کران ڤمبتوڠ، بولت مأنسي کران موافقت", "m": "Keputusan dicapai melalui permuafakatan"}, {"r": "Seperti anjing dengan kucing", "j": "سڤرتي انجيڠ دڠن کوچيڠ", "m": "Selalu bergaduh"}, {"r": "Bagai kacang lupakan kulit", "j": "باڬاي کاچڠ لوڤاکن کوليت", "m": "Lupa akan asal usul atau jasa"}, {"r": "Di mana ada kemahuan, di situ ada jalan", "j": "دمان اد کماهوأن، دسيتو اد جالن", "m": "Jika bersungguh-sungguh pasti ada cara"}], [{"r": "Bagai itik pulang petang", "j": "باڬاي ايتيق ڤولڠ ڤتڠ", "m": "Berjalan dengan sangat lambat"}, {"r": "Ukur baju di badan sendiri", "j": "اوکور باجو دبادن سنديري", "m": "Bertindak mengikut kemampuan sendiri"}, {"r": "Nasi sudah menjadi bubur", "j": "ناسي سوده منجادي بوبور", "m": "Perkara yang telah berlaku tidak dapat diubah"}, {"r": "Seperti cendawan tumbuh selepas hujan", "j": "سڤرتي چنداون تومبوه سلڤس هوجن", "m": "Muncul dengan banyak dalam masa singkat"}, {"r": "Bagai tikus membaiki labu", "j": "باڬاي تيکوس ممباءيقي لابو", "m": "Merosakkan sesuatu ketika cuba membaikinya"}]];
const NAMES=['🔎 Misi 1: Baca Jawi ke Rumi','🧩 Misi 2: Susun Peribahasa Jawi','🔗 Misi 3: Padankan Jawi–Rumi','🎡 Misi 4: Roda Peribahasa'];
const LIMIT=150;let SECRETS=newSecrets();let screen='home',stage=0,q=0,score=0,unlocked=[false,false,false,false],sound=true,answered=false,chosen=[],matched=[],left=null,deadline=0,tick=null,timeoutHandled=false,wheelAngle=0,spinning=false,wheelReady=false,spinTimer=null;
function newSecrets(){let a=new Uint32Array(4);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<4;i++)a[i]=Math.floor(Math.random()*4294967295);return Array.from(a,x=>x%10)}
const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function beep(f,d=.1,delay=0){if(!sound)return;try{let A=window.AudioContext||window.webkitAudioContext;window.ctx=window.ctx||new A();let c=window.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.001,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g).connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.01)}catch(e){}}function good(){[523,659,784].forEach((f,i)=>beep(f,.19,i*.1))}function bad(){beep(220,.23)}
function penalty(){if(screen!=='quiz'||remaining()<=0)return;score-=2;deadline-=10000;beep(390,.12);beep(270,.18,.12);beep(155,.27,.28);updateTimer();if(screen==='quiz')msg('❌ Salah! −2 markah dan −10 saat. Cuba lagi!',false)}
let musicOn=true,musicTimer=null,musicStep=0;
function musicNote(){if(!musicOn||!sound||!window.ctx||screen==='home'||screen==='timeout'||screen==='win')return;let melody=[196,247,294,247,220,262,330,262,174,220,262,220,196,247,294,392];let bass=[98,110,87.31,98];let i=musicStep++;beep(melody[i%melody.length],.15);if(i%4===0)beep(bass[Math.floor(i/4)%4],.32)}
function startMusic(){if(musicTimer)return;musicTimer=setInterval(musicNote,260)}
function stopMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null}
function toggleMusic(){musicOn=!musicOn;if(musicOn)startMusic();else stopMusic();render()}
function beginGame(){screen='map';startMusic();render()}
function clearClocks(){if(tick)clearInterval(tick);tick=null;if(spinTimer)clearTimeout(spinTimer);spinTimer=null}function remaining(){return Math.max(0,Math.ceil((deadline-Date.now())/1000))}function timeLabel(){let t=remaining();return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`}
function updateTimer(){let e=$('#timer');if(e){e.textContent='⏱️ '+timeLabel();e.classList.toggle('danger',remaining()<=30)}if(screen==='quiz'&&remaining()<=0&&!timeoutHandled){timeoutHandled=true;clearClocks();screen='timeout';bad();render()}}
function base(html){$('#app').innerHTML=`<div class="row between"><span class="pill">⭐ Markah: ${score}</span><button class="btn pink" onclick="toggleSound()">${sound?'🔊 Bunyi ON':'🔇 Bunyi OFF'}</button><button class="btn gold" onclick="toggleMusic()">${musicOn?'🎵 Muzik ON':'🎵 Muzik OFF'}</button></div>${html}`}
function toggleSound(){sound=!sound;render()}
function render(){if(screen==='home'){base(`<div style="text-align:center"><div style="font-size:80px">🧭🏴‍☠️</div><h2>Selamat datang, Penjelajah Jawi!</h2><p>Selesaikan <b>4 misi</b> dengan <b>5 cabaran setiap misi</b>. Setiap misi diberi masa <b>2 minit 30 saat</b>. Jawapan salah akan menolak <b>10 saat dan 2 markah</b>.</p><p>Menang satu nombor rahsia bagi setiap misi. Gabungkan 4 nombor untuk membuka peti harta karun!</p><button class="btn green" onclick="beginGame()">🚀 MULA BERMAIN</button></div>`)}else if(screen==='map'){let next=unlocked.findIndex(x=>!x);if(next<0)next=4;base(`<h2 style="text-align:center">🗺️ Peta Pengembaraan</h2><p style="text-align:center">Misi baharu dibuka mengikut turutan. Masa akan bermula apabila misi dimulakan.</p><div class="row">${NAMES.map((n,i)=>`<button class="btn ${unlocked[i]?'green':i===next?'gold':''}" ${i>next?'disabled':''} onclick="start(${i})">${n}<div style="font-size:13px">${unlocked[i]?'✅ Selesai':i>next?'🔒 Berkunci':'▶️ Main'}</div></button>`).join('')}</div><hr style="border:1px solid #e8e1f9;margin:22px 0"><div style="text-align:center"><div style="font-size:65px">🎁</div><h3>Masukkan Kod Rahsia</h3><div class="row">${unlocked.map((v,i)=>`<span class="pill">${v?SECRETS[i]:'❓'}</span>`).join('')}</div><p><button class="btn pink" ${unlocked.every(Boolean)?'':'disabled'} onclick="screen='final';render()">🔐 Buka Peti Harta Karun</button></p></div>`)}else if(screen==='quiz')renderQuiz();else if(screen==='reward'){base(`<div style="text-align:center"><div style="font-size:80px">🏆✨</div><h2>TAHNIAH! MISI ${stage+1} SELESAI!</h2><p>Nombor rahsia kamu:</p><div class="secret">${SECRETS[stage]}</div><p>Ingat nombor ini mengikut susunan misi.</p><button class="btn green" onclick="screen='map';render()">🗺️ Kembali ke Peta</button></div>`)}else if(screen==='timeout'){base(`<div style="text-align:center"><div style="font-size:80px">⏰</div><h2>Masa telah tamat!</h2><p>Kamu berjaya menjawab ${q} daripada 5 cabaran. Cuba semula misi ini untuk memperoleh nombor rahsia.</p><button class="btn gold" onclick="start(stage)">🔄 Cuba Misi Semula</button> <button class="btn pink" onclick="screen='map';render()">🗺️ Peta</button></div>`)}else if(screen==='final'){base(`<div style="text-align:center"><div style="font-size:80px">🔐🎁</div><h2>Peti Harta Karun</h2><p>Masukkan 4 nombor rahsia mengikut turutan misi.</p><input id="code" class="input" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="????" aria-label="Kod empat digit"><p><button class="btn gold" onclick="checkCode()">🔑 BUKA PETI</button></p><div id="msg" class="notice"></div></div>`)}else if(screen==='win'){base(`<div style="text-align:center"><div style="font-size:85px">🎊💰🏆</div><h1>SYABAS, JUARA JAWI!</h1><p>Kamu berjaya menyelesaikan 20 cabaran!</p><h2>⭐ Markah: ${score}</h2><button class="btn green" onclick="restart()">🔄 Main Semula</button></div>`)}}
function start(i){startMusic();let next=unlocked.findIndex(x=>!x);if(next<0)next=4;if(i>next)return;clearClocks();stage=i;q=0;answered=false;chosen=[];matched=[];left=null;spinning=false;wheelReady=false;timeoutHandled=false;screen='quiz';deadline=Date.now()+LIMIT*1000;renderQuiz();tick=setInterval(updateTimer,200);updateTimer()}
function shell(body){if(screen!=='quiz')return;base(`<div class="row between"><button class="btn pink" onclick="leave()">⬅ Peta</button><span class="pill">Soalan ${q+1} / 5</span><span class="timer" id="timer">⏱️ ${timeLabel()}</span></div><h2 style="text-align:center">${NAMES[stage]}</h2><div class="progress"><div style="width:${q/5*100}%"></div></div>${body}<div class="notice" id="msg" aria-live="polite"></div>`);updateTimer()}
function leave(){clearClocks();screen='map';render()}
function renderQuiz(){if(screen!=='quiz')return;if(stage===0){let x=BANK[0][q];let opts=[x.r,BANK[0][(q+2)%5].r,BANK[0][(q+3)%5].r];let offset=q%3;opts=opts.slice(offset).concat(opts.slice(0,offset));shell(`<p class="question">Apakah bacaan Rumi bagi peribahasa Jawi ini?</p><div class="jawi" lang="ms-Arab">${x.j}</div><div class="row">${opts.map(o=>`<button class="btn choice" onclick="answerRumi('${encodeURIComponent(o)}')">${escapeHTML(o)}</button>`).join('')}</div>`)}else if(stage===1){let x=BANK[1][q];let parts=x.j.split(' ');let shuffled=parts.map((p,i)=>({p,i})).sort((a,b)=>((a.i*3+q*2)%parts.length)-((b.i*3+q*2)%parts.length));if(shuffled.every((v,i)=>v.i===i))shuffled.reverse();shell(`<p class="question">Susun perkataan Jawi mengikut peribahasa yang betul.</p><p style="text-align:center">Petunjuk Rumi: <b>${escapeHTML(x.r)}</b></p><div class="slots">${chosen.map((i,k)=>`<button class="slot jawi small" onclick="undo(${k})">${parts[i]}</button>`).join('')}${Array.from({length:parts.length-chosen.length},()=>'<span class="slot">❔</span>').join('')}</div><div class="row">${shuffled.map(({p,i})=>`<button class="btn choice jawi small" ${chosen.includes(i)?'disabled':''} onclick="pick(${i})">${p}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pink" onclick="chosen=[];renderQuiz()">🔄 Padam</button><button class="btn green" ${chosen.length===parts.length?'':'disabled'} onclick="checkOrder()">✔ Semak</button></div>`)}else if(stage===2){let d=BANK[2],order=[2,4,1,3,0];shell(`<p class="question">Padankan setiap peribahasa Jawi dengan bacaan Ruminya.</p><p class="muted" style="text-align:center">Klik Jawi di sebelah kiri, kemudian pilih padanan Rumi di kanan.</p><div class="match"><div>${d.map((x,i)=>`<button class="btn choice jawi small ${left===i?'sel':''} ${matched.includes(i)?'done':''}" ${matched.includes(i)?'disabled':''} onclick="chooseLeft(${i})">${x.j}</button>`).join('')}</div><div>${order.map(i=>`<button class="btn choice ${matched.includes(i)?'done':''}" ${matched.includes(i)?'disabled':''} onclick="chooseRight(${i})">${escapeHTML(d[i].r)}</button>`).join('')}</div></div><p style="text-align:center">Padanan tepat: ${matched.length}/5</p>`)}else{let x=BANK[3][q];shell(`<p class="question">Putar roda! Baca peribahasa Jawi yang terpilih, kemudian taip dalam Rumi.</p><div class="wheel-area"><div class="wheel-frame"><div class="pointer">▼</div><div class="wheel" id="wheel" style="transform:rotate(${wheelAngle}deg)"><div class="wheel-center">🎡</div></div></div></div><div class="row"><button class="btn gold" id="spinBtn" ${spinning||wheelReady?'disabled':''} onclick="spinWheel()">${spinning?'🌀 Sedang berputar...':'🎡 PUTAR RODA'}</button></div><div id="wheelQuestion" class="${wheelReady?'':'hidden'}"><div class="jawi" lang="ms-Arab">${x.j}</div><div class="row"><input id="rumiInput" class="input" autocomplete="off" placeholder="Taip peribahasa dalam Rumi" onkeydown="if(event.key==='Enter')checkWheel()"></div><div class="row" style="margin-top:10px"><button class="btn green" onclick="checkWheel()">✔ Semak Jawapan</button></div></div>`)} }
function msg(t,ok){let e=$('#msg');if(e){e.textContent=t;e.className='notice '+(ok?'ok':'err')}}
function next(){if(answered||screen!=='quiz')return;answered=true;score+=10;good();if(q===4){unlocked[stage]=true;clearClocks();setTimeout(()=>{screen='reward';render();good()},650)}else{setTimeout(()=>{q++;chosen=[];answered=false;wheelReady=false;spinning=false;renderQuiz()},550)}}
function answerRumi(encoded){if(answered||remaining()<=0)return;let v=decodeURIComponent(encoded);if(v===BANK[0][q].r){msg('🌟 Betul! '+BANK[0][q].m,true);next()}else{penalty()}}
function pick(i){if(answered||chosen.includes(i))return;chosen.push(i);beep(470,.06);renderQuiz()}function undo(k){if(answered)return;chosen.splice(k,1);renderQuiz()}function checkOrder(){if(answered)return;let x=BANK[1][q],parts=x.j.split(' ');if(chosen.length===parts.length&&chosen.every((v,i)=>v===i)){msg('🌟 Susunan tepat!',true);next()}else{penalty()}}
function chooseLeft(i){if(answered||matched.includes(i))return;left=i;renderQuiz()}function chooseRight(i){if(answered||matched.includes(i))return;if(left===null){msg('Pilih peribahasa Jawi dahulu.',false);return}if(left===i){matched.push(i);left=null;good();if(matched.length===5){score+=10;unlocked[stage]=true;clearClocks();setTimeout(()=>{screen='reward';render()},650)}else renderQuiz()}else{left=null;renderQuiz();penalty()}}
function normalize(t){return t.toLocaleLowerCase('ms').normalize('NFKC').replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim()}
function spinWheel(){if(spinning||wheelReady||answered||remaining()<=0)return;spinning=true;let btn=$('#spinBtn');btn.disabled=true;btn.textContent='🌀 Sedang berputar...';let wheel=$('#wheel');wheel.classList.add('spinning');wheelAngle+=1800+720+(q*71)+37;requestAnimationFrame(()=>{wheel.style.transform=`rotate(${wheelAngle}deg)`});for(let i=0;i<8;i++)beep(400+i*40,.07,i*.12);spinTimer=setTimeout(()=>{if(screen!=='quiz'||remaining()<=0)return;spinning=false;wheelReady=true;wheel.classList.remove('spinning');btn.textContent='✅ Roda berhenti';$('#wheelQuestion').classList.remove('hidden');$('#rumiInput')?.focus();good()},4300)}
function checkWheel(){if(answered||!wheelReady||remaining()<=0)return;let val=$('#rumiInput')?.value||'';if(normalize(val)===normalize(BANK[3][q].r)){msg('🌟 Bacaan Rumi tepat!',true);next()}else{penalty()}}
function checkCode(){if($('#code').value.trim()===SECRETS.join('')){good();screen='win';stopMusic();render()}else{bad();msg('🔒 Kod belum tepat. Semak nombor setiap misi.',false)}}function restart(){clearClocks();stopMusic();SECRETS=newSecrets();screen='home';stage=0;q=0;score=0;unlocked=[false,false,false,false];wheelAngle=0;render()}render();
</script></body></html>
